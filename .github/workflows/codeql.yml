name: CodeQL

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive

      - name: Ensure LFS assets are present
        run: git lfs pull --exclude='' --include='*'

      - name: Record cb-mpc revision
        id: cbmpc
        run: echo "rev=$(git rev-parse HEAD:cb-mpc)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/.cache
          key: codeql-go-cache-${{ hashFiles('go.sum') }}-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            codeql-go-cache-

      - name: Restore cb-mpc build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/openssl-host
            build/cb-mpc-host
          key: codeql-build-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            codeql-build-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang ninja-build pkg-config python3 perl git curl

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
        with:
          languages: go, cpp

      - name: Build project
        env:
          CBMPC_USE_DOCKER: "0"
        run: |
          make bootstrap
          make test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
