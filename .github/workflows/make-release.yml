name: Make release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Audit outbound calls (does not block egress)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository (with submodules)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          path: ${{ github.ref_name }}
          submodules: recursive

      - name: Prepare release assets
        run: |
          cd "${{ github.ref_name }}"
          bash scripts/make-release.sh "${{ github.ref_name }}"

      - name: Attest release tarball
        id: attestation
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: ${{ github.ref_name }}/cb-mpc-go-${{ github.ref_name }}.tar.gz

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--draft)
          case "${GITHUB_REF_NAME}" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "CB-MPC-Go ${GITHUB_REF_NAME}" \
            "${release_flags[@]}" \
            --notes " " \
            -R "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}/cb-mpc-go-${GITHUB_REF_NAME}.tar.gz" \
            "${{ steps.attestation.outputs.bundle-path }}"
