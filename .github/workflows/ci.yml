name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "api-*"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.11.4
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Audit outbound calls (does not block egress)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository (with submodules)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: make verify-mods

      - name: Record cb-mpc revision (cache key)
        id: cbmpc
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:cb-mpc)" >> "$GITHUB_OUTPUT"

      - name: Restore cb-mpc build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            cb-mpc/build
            cb-mpc/lib
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            cbmpc-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            perl \
            pkg-config \
            rsync

      - name: Build custom OpenSSL
        run: |
          sudo bash scripts/openssl/build-static-openssl-linux.sh
          sudo mkdir -p /usr/local/lib64 /usr/local/lib /usr/local/include
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib64/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/include/openssl /usr/local/include/openssl

      - name: Run golangci-lint
        run: make lint

  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Audit outbound calls (does not block egress)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository (with submodules)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: make verify-mods

      - name: Record cb-mpc revision (cache key)
        id: cbmpc
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:cb-mpc)" >> "$GITHUB_OUTPUT"

      - name: Restore cb-mpc build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            cb-mpc/build
            cb-mpc/lib
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            cbmpc-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            perl \
            pkg-config \
            rsync

      - name: Build custom OpenSSL
        run: |
          sudo bash scripts/openssl/build-static-openssl-linux.sh
          sudo mkdir -p /usr/local/lib64 /usr/local/lib /usr/local/include
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib64/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/include/openssl /usr/local/include/openssl

      - name: Run govulncheck
        run: make vulncheck

  sanitize-go:
    name: Sanitized CGO boundary
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Audit outbound calls (does not block egress)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository (with submodules)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: make verify-mods

      - name: Record cb-mpc revision (cache key)
        id: cbmpc
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:cb-mpc)" >> "$GITHUB_OUTPUT"

      - name: Restore cb-mpc build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            cb-mpc/build
            cb-mpc/lib
          key: cbmpc-sanitize-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            cbmpc-sanitize-go-${{ runner.os }}-${{ runner.arch }}-
            cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbmpc.outputs.rev }}
            cbmpc-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            perl \
            pkg-config \
            rsync

      - name: Build custom OpenSSL
        run: |
          sudo bash scripts/openssl/build-static-openssl-linux.sh
          sudo mkdir -p /usr/local/lib64 /usr/local/lib /usr/local/include
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib64/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/include/openssl /usr/local/include/openssl

      - name: Run sanitized CGO boundary tests
        run: make sanitize-go

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Audit outbound calls (does not block egress)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository (with submodules)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: make verify-mods

      - name: Record cb-mpc revision (cache key)
        id: cbmpc
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:cb-mpc)" >> "$GITHUB_OUTPUT"

      - name: Restore cb-mpc build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            cb-mpc/build
            cb-mpc/lib
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbmpc.outputs.rev }}
          restore-keys: |
            cbmpc-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            perl \
            pkg-config \
            rsync

      - name: Ensure sha256sum is available (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            exit 0
          fi
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Ensure OpenSSL install prefix is writable (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /usr/local/opt
          sudo chown -R "$(whoami)" /usr/local/opt

      - name: Build custom OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo bash scripts/openssl/build-static-openssl-linux.sh
          sudo mkdir -p /usr/local/lib64 /usr/local/lib /usr/local/include
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib64/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/lib64/libcrypto.a /usr/local/lib/libcrypto.a
          sudo ln -sf /usr/local/opt/openssl@3.6.1/include/openssl /usr/local/include/openssl

      - name: Run Go tests (builds cb-mpc public install as needed)
        run: make test

      - name: Run go vet
        run: bash scripts/go_with_cpp.sh go vet ./...

      - name: Run examples
        run: make examples
