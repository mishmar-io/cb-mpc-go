version: 2
run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - gocritic
    - revive
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - misspell

linters-settings:
  revive:
    severity: warning
  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude the noisy gocritic dupSubExpr in CGO-heavy backend bindings only.
    - linters:
        - gocritic
      text: "suspicious identical LHS and RHS"
      path: "pkg/cbmpc/internal/backend/.*"

# v2: configure formatters separately
formatters:
  enable:
    - gofumpt
    - gci

formatters-settings:
  gofumpt:
    module-path: github.com/coinbase/cb-mpc-go
  gci:
    sections:
      - Standard
      - Default
      - Prefix(github.com/coinbase/cb-mpc-go)
    skip-generated: true
